default: &default
  adapter: postgresql
  encoding: unicode
  username: bglmautam
  password: admin@bglmautam
  timeout: 5000
  host: localhost
  port: 5432
  pool: 5

development:
  <<: *default
  database: bglmautam_development
  port: 5433

production:
  <<: *default
  database: bglmautam_production
  password: <%= ENV["DATABASE_PASSWORD"] %>

test:
  <<: *default
  database: bglmautam_test
  port: 5433